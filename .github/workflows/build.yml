name: build-android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: actions/setup-go@v5
        with: { go-version: stable }

      - uses: android-actions/setup-android@v3

      - name: Build Xray core (gomobile -> AAR)
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          go get github.com/xtls/xray-core@latest golang.org/x/mobile@latest
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/arm -androidapi 26 -ldflags="-s -w" -o ../app/libs/xraycore.aar .

      - name: Geo data
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/geoip.dat   https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL -o app/src/main/assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет KEYSTORE_B64 не задан: APK подписан временным ключом, обновление поверх установленного не сработает"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build APK (версия берётся из тега)
        run: |
          VER="1.0.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          gradle :app:assembleRelease -PversionName="$VER" -PversionCode="$GITHUB_RUN_NUMBER" --no-daemon
          cp app/build/outputs/apk/release/*.apk Mikaela-VPN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mikaela-VPN-apk
          path: Mikaela-VPN.apk

      - name: Publish to release (только по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mikaela-VPN.apk
