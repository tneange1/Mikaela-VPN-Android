name: build-android
on:
  push:
    branches: [main, ptb, dev]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }

      - name: Android SDK / NDK (предустановлены на раннере)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Xray core (gomobile -> AAR)
        working-directory: core
        run: |
          set -ex
          go version
          go get github.com/xtls/xray-core@latest golang.org/x/mobile@latest
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64,android/arm -androidapi 26 -ldflags="-s -w" -o ../app/libs/xraycore.aar .
          ls -la ../app/libs

      - name: Geo data
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/geoip.dat   https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL -o app/src/main/assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет KEYSTORE_B64 не задан: APK подписан временным ключом, обновление поверх установленного не сработает"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      # Версия берётся из version.txt (или из тега v*). Если релиза с такой версией ещё нет, он создаётся автоматически.
      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(tr -d '[:space:]' < version.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build APK
        run: |
          gradle :app:assembleRelease -PversionName="${{ steps.ver.outputs.version }}" -PversionCode="$GITHUB_RUN_NUMBER" --no-daemon
          cp app/build/outputs/apk/release/*.apk Mikaela-VPN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mikaela-VPN-apk
          path: Mikaela-VPN.apk

      - name: Publish release (тег v* или новая версия из version.txt)
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          body: |
            version: ${{ steps.ver.outputs.version }}
            build: ${{ github.run_number }}
          files: Mikaela-VPN.apk

      - name: Канал PTB/Dev (постоянный пререлиз, не попадает в «последний»)
        if: github.ref == 'refs/heads/ptb' || github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${GITHUB_REF_NAME}"
          gh release delete "$CH" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$CH" Mikaela-VPN.apk --prerelease --target "$GITHUB_SHA" --title "Канал $CH" --notes "version: ${{ steps.ver.outputs.version }}
          build: ${{ github.run_number }}" --repo "$GITHUB_REPOSITORY"
